<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Erich's Bento Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #e6ebf2;
      --ink: #101a3a;
      --blue: #2f3bff
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif
    }

    /* Fit the screen exactly */
    .screen {
      height: 100vh;
      height: 100dvh
    }

    /* Extra row heights (Bootstrap only ships 25/50/75/100) */
    .h-third {
      height: 33.3333%
    }

    .h-two-thirds {
      height: 66.6667%
    }

    /* Every .card is a plain outlined box */
    .card {
      border: 2px solid var(--ink);
      border-radius: 0;
      overflow: hidden;
      background: transparent
    }

    .card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--pos, 50% 50%);
      border-radius: 0
    }

    /* Title card: no outline */
    .card-title-box {
      border: 0;
      background: var(--blue);
      color: #fff
    }

    .card-title-box h1 {
      margin: 0;
      font-weight: 800;
      line-height: .92;
      letter-spacing: -.035em;
      font-size: clamp(1.8rem, min(6.2vw, 11vh), 6.4rem)
    }

    .card-title-box p {
      margin: 0;
      max-width: 30ch;
      line-height: 1.3;
      font-size: clamp(.8rem, 1.9vh + .2vw, 1.1rem)
    }

    .title-img {
      width: 50%;
      /* half of the title box's width */
      height: 48%;
      /* almost half of its height */
      object-fit: contain;
      /* never distorts the image */
      object-position: right bottom;
    }

    .stat b {
      font-size: clamp(1.8rem, min(5vw, 9vh), 4.6rem);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1
    }

    .stat span {
      font-size: clamp(.75rem, 1.7vh + .2vw, 1rem)
    }

    .quote q {
      quotes: none;
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -.02em;
      font-size: clamp(1rem, min(2vw, 3.6vh), 2rem)
    }

    @media (min-width:768px) {

      .col-left,
      .col-right {
        height: 100%
      }
    }

    /* Phones: stack the two halves, still exactly one screen */
    @media (max-width:767.98px) {
      .col-left {
        height: 45%
      }

      .col-right {
        height: 55%
      }

      .card-title-box h1 {
        font-size: clamp(1.5rem, min(9vw, 6vh), 3rem)
      }

      .card-title-box p {
        display: none
      }
    }
  </style>
</head>

<body>

  <main class="container-fluid screen p-1">
    <div class="row g-0 h-100">

      <!-- LEFT HALF -->
      <div class="col-12 col-md-5 col-left p-0">
        <div class="row g-0 h-50">
          <!-- 1. Title (first box, no outline) -->
          <div class="col-12 h-100 p-1">
            <div class="card card-title-box h-100">
              <div class="card-body d-flex flex-column justify-content-between p-3 p-md-4">
                <h1>Hi, I'm Erich!</h1>
                <p>QWERTYUIOP</p>
              </div>
              <img class="title-img position-absolute bottom-0 end-0" src="assets/me.png" alt="1">
            </div>
          </div>
        </div>

        <div class="row g-0 h-50">
          <!-- 2. Tall image -->
          <div class="col-12 col-md-7 h-100 p-1">
            <div class="card h-100" style="--pos:50% 30%">
              <img class="card-img" src="assets/1.jpeg" alt="2">
            </div>
          </div>
          <!-- 3. Quote -->
          <div class="col-md-5 d-none d-md-block h-100 p-1">
            <div class="card quote h-100">
              <div class="card-body d-flex align-items-start p-3">
                <q>This is my</q>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT HALF -->
      <div class="col-12 col-md-7 col-right p-0">

        <div class="row g-0 h-two-thirds">
          <!-- 4. Tall image -->
          <div class="col-5 h-100 p-1">
            <div class="card h-100" style="--pos:50% 40%">
              <img class="card-img" src="assets/2.JPEG" alt="4">
            </div>
          </div>

          <div class="col-7 h-100 p-0">
            <div class="row g-0 h-50">
              <!-- 5. Wide image -->
              <div class="col-12 h-100 p-1">
                <div class="card h-100">
                  <img class="card-img" src="assets/5.JPEG" alt="5">
                </div>
              </div>
            </div>
            <div class="row g-0 h-50">
              <!-- 6. Stat -->
              <div class="col-6 h-100 p-1">
                <div class="card stat h-100">
                  <div class="card-body d-flex flex-column justify-content-end p-2 p-md-3">
                    <b>Bento</b><span>grid output</span>
                  </div>
                </div>
              </div>
              <!-- 7. Small image -->
              <div class="col-6 h-100 p-1">
                <div class="card h-100">
                  <img class="card-img" src="assets/3.jpg" alt="7">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-0 h-third">
          <!-- 8. Bottom wide image -->
          <div class="col-12 h-100 p-1">
            <div class="card h-100" style="--pos:50% 60%">
              <img class="card-img" src="assets\6.jpeg" alt="8">
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

</body>

</html>
