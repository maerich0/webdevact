<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tokyo Revengers | Character Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-title {
            color: #ffcc00;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.6);
            border-bottom: 3px solid #ffcc00;
            display: inline-block;
            padding-bottom: 10px;
        }

        .tokyo-card {
            background-color: #1a1a1a;
            border: none;
            border-left: 5px solid #ffcc00;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .tokyo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(255, 204, 0, 0.15);
            border-left: 5px solid #ff0000;
        }

        .char-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #333;
            transition: filter 0.3s ease;
        }

        .tokyo-card:hover .char-img {
            border-color: #ff0000;
        }

        .char-name {
            color: #ffcc00;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .char-age {
            font-size: 0.85rem;
            color: #888888;
            font-style: italic;
            margin-bottom: 15px;
        }

        .char-desc {
            color: #cccccc;
            line-height: 1.6;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="main-title">Tokyo Revengers</h1>
            <p class="text-center">made by erich</p>
            <h3 class="text-center mt-2">Main Casts</h3>
        </div>
        <div class="row g-4" id="parent">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        var people = [
            {
                firstName: "Takemichi",
                lastName: "Hanagaki",
                age: 26,
                description: "The main protagonist who time-leaps to save his girlfriend, Hinata, and changes the fate of the Tokyo Manji Gang.",
                image: "images/Takemichi.webp"
            },
            {
                firstName: "Manjiro",
                lastName: "Sano",
                age: 15,
                description: "The charismatic and formidable leader of the Tokyo Manji Gang, known as 'Invincible Mikey'.",
                image: "images/Mikey.webp"
            },
            {
                firstName: "Ken",
                lastName: "Ryuguji",
                age: 15,
                description: "The vice-president and co-founder of the Tokyo Manji Gang. He is Mikey's best friend and moral compass, easily recognized by his dragon tattoo.",
                image: "images/Draken.webp"
            },
            {
                firstName: "Hinata",
                lastName: "Tachibana",
                age: 26,
                description: "Takemichi's upbeat and fiercely loyal girlfriend, whose tragic death in the present triggers his time-leaping journey.",
                image: "images/Hinata.webp"
            },
            {
                firstName: "Naoto",
                lastName: "Tachibana",
                age: 25,
                description: "Hinata's younger brother and a police detective in the present. His handshake with Takemichi acts as the trigger for time travel.",
                image: "images/Naoto.webp"
            },
            {
                firstName: "Chifuyu",
                lastName: "Matsuno",
                age: 14,
                description: "The vice-captain of the First Division of Toman. He becomes Takemichi's closest confidant and most loyal friend.",
                image: "images/Chifuyu.webp"
            },
            {
                firstName: "Keisuke",
                lastName: "Baji",
                age: 14,
                description: "The Captain of Toman's First Division and one of its founding members, possessing a fierce and sacrificial loyalty to his friends.",
                image: "images/Baji.webp"
            },
            {
                firstName: "Tetta",
                lastName: "Kisaki",
                age: 13,
                description: "A ruthless and calculating antagonist who manipulates the Tokyo Manji Gang from the shadows to achieve his own twisted ambitions.",
                image: "images/Kisaki.webp"
            },
            {
                firstName: "Shuji",
                lastName: "Hanma",
                age: 16,
                description: "Kisaki's right-hand man and a thrill-seeking delinquent known for his 'Sin' and 'Punishment' hand tattoos. He frequently acts as an enforcer.",
                image: "images/Hanma.webp"
            },
            {
                firstName: "Kazutora",
                lastName: "Hanemiya",
                age: 15,
                description: "A founding member of Toman who harbors deep psychological trauma and a twisted vendetta against Mikey after a tragic past event.",
                image: "images/Kazutora.webp"
            },
            {
                firstName: "Atsushi",
                lastName: "Sendo",
                age: 14,
                description: "Nicknamed 'Akkun', he is the leader of Takemichi's middle school friend group. He is fiercely protective of his friends but deeply affected by Kisaki's manipulation.",
                image: "images/Akkun.webp"
            },
            {
                firstName: "Haruki",
                lastName: "Hayashida",
                age: 15,
                description: "Nicknamed 'Pah-chin', he is a founding member of Toman and its original Third Division Captain. He is brash but values his friends above all else.",
                image: "images/Pah-Chin.webp"
            }
        ];

        var parent = document.getElementById("parent");

        for (var i = 0; i < people.length; i++) {
            parent.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card tokyo-card h-100 shadow rounded-3 p-4">
            <img src="` + people[i].image + `" alt="` + people[i].firstName + `" class="char-img">
            <div class="h3 char-name">` + people[i].firstName + " " + people[i].lastName + `</div>
            <div class="char-age">Age: ` + people[i].age + `</div>
            <div class="mt-2 char-desc">
              ` + people[i].description + `
            </div>
          </div>
        </div>
      `;
        }
    </script>
</body>

</html>
